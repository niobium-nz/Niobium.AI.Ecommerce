name: Publish to Prod

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

env:
  VERSION_MAJOR: 1
  VERSION_MINOR: 0

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
 
      - name: azd login
        run: azd auth login --federated-credential-provider github --client-id ${{ vars.AZURE_CLIENT_ID }} --tenant-id ${{ vars.AZURE_TENANT_ID }}

      - name: Publish
        env:
          AZURE_ENV_NAME: ${{ github.environment }}
          VERSION_MAJOR: ${{ env.VERSION_MAJOR }}
          VERSION_MINOR: ${{ env.VERSION_MINOR }}
          APPSETTING_LLM_ENDPOINT: ${{ vars.APPSETTING_LLM_ENDPOINT }}
          APPSETTING_LLM_KEY: ${{ secrets.APPSETTING_LLM_KEY }}
        run: azd up --no-prompt

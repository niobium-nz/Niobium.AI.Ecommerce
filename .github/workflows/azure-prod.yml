name: Publish to Prod

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

env:
  VERSION_MAJOR: 1
  VERSION_MINOR: 0

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
 
      - name: azd login
        run: azd auth login --federated-credential-provider github --client-id ${{ vars.AZURE_CLIENT_ID }} --tenant-id ${{ vars.AZURE_TENANT_ID }}

      - name: Publish
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          APPSETTING_SERVICE_NAME: ${{ env.SERVICE_NAME }}
          APPSETTING_SERVICE_VERSION: '${{ env.VERSION_MAJOR }}.${{ env.VERSION_MINOR }}.${{ env.GITHUB_RUN_NUMBER }}'
          APPSETTING_OPENAIOPTIONS__RESPONSEENDPOINT: ${{ vars.APPSETTING_OPENAIOPTIONS__RESPONSEENDPOINT }}
          APPSETTING_OPENAIOPTIONS__RESPONSEENDPOINTKEY: ${{ secrets.APPSETTING_OPENAIOPTIONS__RESPONSEENDPOINTKEY }}
          APPSETTING_OPENAIOPTIONS__RETRYKEYWORDS__0: ${{ vars.APPSETTING_OPENAIOPTIONS__RETRYKEYWORDS__0 }}
          APPSETTING_FIRECRAWLOPTIONS__APIKEY: ${{ secrets.APPSETTING_FIRECRAWLOPTIONS__APIKEY }}
          APPSETTING_ECOMMERCEOPTIONS__SCRAPECREATORSKEY: ${{ vars.APPSETTING_ECOMMERCEOPTIONS__SCRAPECREATORSKEY }}
        run: azd up -e ${{ vars.AZURE_ENV_NAME }} --no-prompt

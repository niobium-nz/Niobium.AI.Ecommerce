# Platform-neutral descriptive metadata, not a vendor-native import schema.
name: ecommerce-onboarding-specialist
version: 1.0.0
entrypoint: AGENT.md
description: Prepare marketing and image-prompt strategies for an approved product.
input_schema: schemas/contracts.schema.json#/$defs/input
config_schema: schemas/contracts.schema.json#/$defs/config
artifact_schema: schemas/contracts.schema.json#/$defs/artifact
result_schema: schemas/contracts.schema.json#/$defs/result
skills:
  - skills/ecommerce-profile-offers/SKILL.md
  - skills/ecommerce-develop-strategy/SKILL.md
  - skills/ecommerce-draft-prompts/SKILL.md
approval_precondition: approved_product_from_authorized_caller
handoff_target: website_implementation
capabilities:
  - headed_interactive_browser_with_visible_inspection_and_cleanup
  - caller_board_pixel_reading
  - trusted_uuid_and_lossless_json
  - google_drive_exact_lookup_folder_create_raw_upload_and_verification
storage:
  root_folder_name: candidates
  root_id_configuration_key: candidates_folder_id
  path: "candidates/{signal_id}/{candidate_id}.json"
  unlinked_path: "candidates/unlinked/{candidate_id}.json"
  mime_type: application/json
  overwrite: false
adapters:
  chatgpt: adapters/chatgpt-workspace-agent.md
  claude: adapters/claude-cowork.md
